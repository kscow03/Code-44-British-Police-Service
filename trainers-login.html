<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trainer Login - ARU Academy</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        linear-gradient(rgba(2,7,14,.86),rgba(2,7,14,.96)),
        url('arv-photo.png');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
    font-family:Segoe UI,Arial,sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.login-card{
    width:100%;
    max-width:480px;

    background:rgba(11,17,27,.96);

    border:1px solid #16315c;
    border-radius:12px;

    padding:35px;

    box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo-area h1{
    margin:0 0 8px;
    color:#4d9dff;
    font-size:2rem;
}

.logo-area p{
    margin:4px 0;
    color:#b8c4d6;
}

.badge{
    display:inline-block;

    margin-top:12px;
    padding:7px 13px;

    background:#3a2a0d;
    border:1px solid #a8761e;
    border-radius:20px;

    color:#f2c76f;
    font-weight:bold;
}

label{
    display:block;
    margin-bottom:8px;

    color:#dbe7f7;
    font-weight:bold;
}

input{
    width:100%;

    padding:13px 14px;

    background:#08111d;
    color:white;

    border:1px solid #244c80;
    border-radius:7px;

    font-size:1rem;
    outline:none;
}

input:focus{
    border-color:#4d9dff;
}

button{
    width:100%;

    margin-top:16px;
    padding:13px 18px;

    background:#4d9dff;
    color:#05080d;

    border:none;
    border-radius:7px;

    font-size:1rem;
    font-weight:bold;

    cursor:pointer;
}

button:hover{
    background:#77b5ff;
}

.error-message{
    display:none;

    margin-top:15px;
    padding:12px;

    background:#2b1014;
    border:1px solid #853442;
    border-radius:7px;

    color:#ffb8c0;
    text-align:center;
}

.back-link{
    display:block;

    margin-top:20px;

    color:#4d9dff;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
}

.back-link:hover{
    color:white;
}

.notice{
    margin-top:24px;
    padding-top:18px;

    border-top:1px solid #16315c;

    color:#8f9bad;
    font-size:.88rem;
    text-align:center;
}

</style>
</head>

<body>

<div class="login-card">

    <div class="logo-area">

        <h1>ARU Trainers Area</h1>

        <p>Code44 Police Service</p>

        <p>Academy Training & Standards</p>

        <span class="badge">Restricted Access</span>

    </div>

    <form id="trainerLoginForm">

        <label for="ARUCourses">
            Trainer Access Password
        </label>

        <input
            type="password"
            id="trainerPassword"
            placeholder="ARUMODULE"
            autocomplete="off"
            required
        >

        <button type="submit">
            Access Trainers Area
        </button>

    </form>

    <div id="errorMessage" class="error-message">
        Incorrect trainer password. Access denied.
    </div>

    <a class="back-link" href="academy.html">
        ← Return to ARU Academy
    </a>

    <div class="notice">

        Access is restricted to approved ARU trainers.<br>
        Do not share trainer material or assessment information.

    </div>

</div>

<script>

/*
    CHANGE THE PASSWORD BELOW.

    Do not use a password that you use for Discord,
    email, banking or any other real account.
*/

const TRAINER_PASSWORD = "Code44Trainer01";

const loginForm = document.getElementById("trainerLoginForm");
const passwordInput = document.getElementById("trainerPassword");
const errorMessage = document.getElementById("errorMessage");

/*
    If the trainer is already logged in during this browser session,
    send them straight to the Trainers Area.
*/

if (sessionStorage.getItem("trainerAccess") === "granted") {
    window.location.href = "trainers.html";
}

loginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const enteredPassword = passwordInput.value;

    if (enteredPassword === TRAINER_PASSWORD) {

        sessionStorage.setItem("trainerAccess", "granted");

        window.location.href = "trainers.html";

    } else {

        errorMessage.style.display = "block";

        passwordInput.value = "";
        passwordInput.focus();

    }

});

</script>

</body>
</html>
